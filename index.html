<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E5231B" />
    <script>
      // Apply the persisted/system theme before first paint to avoid a light flash.
      (function () {
        try {
          var stored = window.localStorage.getItem('aitask-color-theme');
          var preference = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark = preference === 'dark'
            || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.dataset.theme = dark ? 'dark' : 'light';
          root.dataset.themePreference = preference;
          root.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#101618' : '#E5231B');
        } catch (error) {
          // Theme bootstrap is best-effort; the app re-applies it on mount.
        }
      })();
    </script>
    <meta name="description" content="Marketing agency task, project, calendar, and approval management." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AiTask" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>AiTask - Marketing Agency Task Management</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="i18n-portals"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
