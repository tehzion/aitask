name: Quality and Security

on:
  pull_request:
  push:
    branches: [main, master]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Includes the complete serial browser suite, PWA checks, and builds.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm audit --prod --audit-level high; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Production dependency audit failed after 3 workflow attempts."
              exit 1
            fi
            echo "Production dependency audit attempt $attempt failed; retrying in 20 seconds."
            sleep 20
          done

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify migration files
        run: pnpm verify:migrations

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit and permission tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Verify bundle budgets
        run: pnpm verify:bundle 2>&1 | tee bundle-verification.log

      - name: Verify PWA output
        run: pnpm verify:pwa

      - name: PWA install and offline shell
        run: pnpm test:e2e:pwa

      - name: Verify Supabase secure cutover
        run: pnpm verify:supabase
        env:
          AITASK_EXPECT_SECURE_CUTOVER: 'true'

      - name: Browser smoke test
        run: pnpm test:e2e

      - name: Hosted login localization
        run: pnpm test:e2e:login-i18n

      - name: Retain bundle and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-evidence-${{ github.run_id }}
          path: |
            bundle-verification.log
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 30

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for authenticated output workflow
        run: pnpm exec playwright install --with-deps chromium

      - name: Docker diagnostics
        run: docker info

      - name: Validate migrations, pgTAP, lint, advisors, and postflight
        run: pnpm verify:supabase:rollout 2>&1 | tee supabase-rollout.log

      - name: Retain database rollout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supabase-rollout-${{ github.run_id }}
          path: supabase-rollout.log
          if-no-files-found: ignore
          retention-days: 30
