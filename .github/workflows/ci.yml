name: Quality and Security

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm audit --prod --audit-level high; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Production dependency audit failed after 3 workflow attempts."
              exit 1
            fi
            echo "Production dependency audit attempt $attempt failed; retrying in 20 seconds."
            sleep 20
          done

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit and permission tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Verify PWA output
        run: pnpm verify:pwa

      - name: PWA install and offline shell
        run: pnpm test:e2e:pwa

      - name: Verify Supabase secure cutover
        run: pnpm verify:supabase
        env:
          AITASK_EXPECT_SECURE_CUTOVER: 'true'

      - name: Browser smoke test
        run: pnpm test:e2e

      - name: Hosted login localization
        run: pnpm test:e2e:login-i18n

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migrations, pgTAP, lint, advisors, and postflight
        run: pnpm verify:supabase:rollout
