name: One-time v2.1.0 production release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emergency-v2.1.0-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Explicitly authorised one-time exception. This secret is not logged or
      # exposed to the deployed application.
      VERCEL_TOKEN: ${{ secrets.VERCEL270826 }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
      RELEASE_TAG: v2.1.0
      AITASK_EXPECT_SECURE_CUTOVER: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.1.0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate the immutable release target
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_CLI_VERSION"
          test "$(node -p \"require('./package.json').version\")" = "${RELEASE_TAG#v}"
          RELEASE_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$RELEASE_COMMIT" = "5cdcfb7153f2f0146ae0c4afdb98ed93bc1b22a1"
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the production source gate
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ env.RELEASE_COMMIT }}
        run: |
          pnpm audit --prod --audit-level high
          pnpm check
          pnpm lint
          pnpm test
          pnpm build
          pnpm verify:pwa
          pnpm verify:release-provenance -- --file dist/build-info.json --version "${RELEASE_TAG#v}" --commit "$RELEASE_COMMIT"

      - name: Validate Supabase rollout in a disposable stack
        run: pnpm verify:supabase:rollout

      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unauthenticated browser gates
        run: |
          pnpm test:e2e:pwa
          pnpm test:e2e
          pnpm test:e2e:login-i18n

      - name: Pull production environment
        run: pnpm dlx --yes "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build and deploy the tagged artifact to production
        id: production
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ env.RELEASE_COMMIT }}
        run: |
          pnpm dlx --yes "vercel@$VERCEL_CLI_VERSION" build --prod --token="$VERCEL_TOKEN"
          echo "url=$(pnpm dlx --yes \"vercel@$VERCEL_CLI_VERSION\" deploy --prebuilt --prod --yes --token=\"$VERCEL_TOKEN\")" >> "$GITHUB_OUTPUT"

      - name: Verify live production release and security
        env:
          RELEASE_URL: ${{ steps.production.outputs.url }}
          VERCEL_GIT_COMMIT_SHA: ${{ env.RELEASE_COMMIT }}
        run: |
          pnpm verify:release-provenance -- --url "$RELEASE_URL" --version "${RELEASE_TAG#v}" --commit "$RELEASE_COMMIT"
          for path in / /login /manifest.webmanifest /sw.js /build-info.json; do
            curl --fail --location --silent --show-error --output /dev/null "$RELEASE_URL$path"
          done
          set -a
          . .vercel/.env.production.local
          set +a
          pnpm verify:supabase
