name: Authenticated Staging QA

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: authenticated-staging-qa
  cancel-in-progress: true

jobs:
  verify-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Require an internal release branch
        run: test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate isolated staging configuration
        env:
          STAGING_VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
          STAGING_VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          STAGING_QA_SUPER_ADMIN_EMAIL: ${{ secrets.STAGING_QA_SUPER_ADMIN_EMAIL }}
          STAGING_QA_SUPER_ADMIN_PASSWORD: ${{ secrets.STAGING_QA_SUPER_ADMIN_PASSWORD }}
          STAGING_QA_OPERATION_EMAIL: ${{ secrets.STAGING_QA_OPERATION_EMAIL }}
          STAGING_QA_OPERATION_PASSWORD: ${{ secrets.STAGING_QA_OPERATION_PASSWORD }}
          STAGING_QA_PRODUCTION_EMAIL: ${{ secrets.STAGING_QA_PRODUCTION_EMAIL }}
          STAGING_QA_PRODUCTION_PASSWORD: ${{ secrets.STAGING_QA_PRODUCTION_PASSWORD }}
          STAGING_QA_ACCOUNT_EMAIL: ${{ secrets.STAGING_QA_ACCOUNT_EMAIL }}
          STAGING_QA_ACCOUNT_PASSWORD: ${{ secrets.STAGING_QA_ACCOUNT_PASSWORD }}
          STAGING_QA_CLIENT_EMAIL: ${{ secrets.STAGING_QA_CLIENT_EMAIL }}
          STAGING_QA_CLIENT_PASSWORD: ${{ secrets.STAGING_QA_CLIENT_PASSWORD }}
          STAGING_QA_PASSWORD_SETUP_EMAIL: ${{ secrets.STAGING_QA_PASSWORD_SETUP_EMAIL }}
          STAGING_QA_PASSWORD_SETUP_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD_SETUP_PASSWORD }}
          STAGING_QA_PASSWORD_SETUP_NEW_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD_SETUP_NEW_PASSWORD }}
        run: |
          test -n "$VERCEL_CLI_VERSION"
          for value in \
            "$STAGING_VERCEL_TOKEN" "$STAGING_VERCEL_ORG_ID" "$STAGING_VERCEL_PROJECT_ID" \
            "$STAGING_SUPABASE_URL" "$STAGING_SUPABASE_PUBLISHABLE_KEY" \
            "$STAGING_SUPABASE_PROJECT_REF" \
            "$PRODUCTION_SUPABASE_URL" "$STAGING_QA_SUPER_ADMIN_EMAIL" \
            "$STAGING_QA_SUPER_ADMIN_PASSWORD" "$STAGING_QA_OPERATION_EMAIL" \
            "$STAGING_QA_OPERATION_PASSWORD" "$STAGING_QA_PRODUCTION_EMAIL" \
            "$STAGING_QA_PRODUCTION_PASSWORD" "$STAGING_QA_ACCOUNT_EMAIL" \
            "$STAGING_QA_ACCOUNT_PASSWORD" "$STAGING_QA_CLIENT_EMAIL" \
            "$STAGING_QA_CLIENT_PASSWORD" "$STAGING_QA_PASSWORD_SETUP_EMAIL" \
            "$STAGING_QA_PASSWORD_SETUP_PASSWORD" "$STAGING_QA_PASSWORD_SETUP_NEW_PASSWORD"; do
            test -n "$value"
          done
          test "$STAGING_SUPABASE_URL" != "$PRODUCTION_SUPABASE_URL"
          test "$STAGING_SUPABASE_URL" = "https://$STAGING_SUPABASE_PROJECT_REF.supabase.co"
          case "$STAGING_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) exit 1 ;; esac

      - name: Install dependencies and browser runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Pull isolated staging environment
        env:
          VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        run: pnpm dlx "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build and deploy staging candidate
        id: staging
        env:
          VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx "vercel@$VERCEL_CLI_VERSION" build --prod --token="$VERCEL_TOKEN"
          pnpm verify:release-provenance -- --file .vercel/output/static/build-info.json --version "$(node -p 'require("./package.json").version')" --commit "$GITHUB_SHA"
          deployment_url="$(pnpm dlx "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          case "$deployment_url" in https://*) ;; *) exit 1 ;; esac
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify staging provenance and secure cutover
        env:
          RELEASE_URL: ${{ steps.staging.outputs.url }}
          VITE_AITASK_BACKEND: supabase
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          AITASK_EXPECT_SECURE_CUTOVER: 'true'
        run: |
          pnpm verify:release-provenance -- --url "$RELEASE_URL" --version "$(node -p 'require("./package.json").version')" --commit "$GITHUB_SHA"
          pnpm verify:supabase

      - name: Seed isolated staging QA fixture
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          STAGING_QA_SUPER_ADMIN_EMAIL: ${{ secrets.STAGING_QA_SUPER_ADMIN_EMAIL }}
          STAGING_QA_SUPER_ADMIN_PASSWORD: ${{ secrets.STAGING_QA_SUPER_ADMIN_PASSWORD }}
          STAGING_QA_OPERATION_EMAIL: ${{ secrets.STAGING_QA_OPERATION_EMAIL }}
          STAGING_QA_OPERATION_PASSWORD: ${{ secrets.STAGING_QA_OPERATION_PASSWORD }}
          STAGING_QA_PRODUCTION_EMAIL: ${{ secrets.STAGING_QA_PRODUCTION_EMAIL }}
          STAGING_QA_PRODUCTION_PASSWORD: ${{ secrets.STAGING_QA_PRODUCTION_PASSWORD }}
          STAGING_QA_ACCOUNT_EMAIL: ${{ secrets.STAGING_QA_ACCOUNT_EMAIL }}
          STAGING_QA_ACCOUNT_PASSWORD: ${{ secrets.STAGING_QA_ACCOUNT_PASSWORD }}
          STAGING_QA_CLIENT_EMAIL: ${{ secrets.STAGING_QA_CLIENT_EMAIL }}
          STAGING_QA_CLIENT_PASSWORD: ${{ secrets.STAGING_QA_CLIENT_PASSWORD }}
          STAGING_QA_PASSWORD_SETUP_EMAIL: ${{ secrets.STAGING_QA_PASSWORD_SETUP_EMAIL }}
          STAGING_QA_PASSWORD_SETUP_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD_SETUP_PASSWORD }}
        run: node scripts/reset-staging-qa.mjs seed | tee staging-fixture.json

      - name: Run authenticated staging QA
        env:
          STAGING_E2E_BASE_URL: ${{ steps.staging.outputs.url }}
          STAGING_QA_SUPER_ADMIN_EMAIL: ${{ secrets.STAGING_QA_SUPER_ADMIN_EMAIL }}
          STAGING_QA_SUPER_ADMIN_PASSWORD: ${{ secrets.STAGING_QA_SUPER_ADMIN_PASSWORD }}
          STAGING_QA_OPERATION_EMAIL: ${{ secrets.STAGING_QA_OPERATION_EMAIL }}
          STAGING_QA_OPERATION_PASSWORD: ${{ secrets.STAGING_QA_OPERATION_PASSWORD }}
          STAGING_QA_PRODUCTION_EMAIL: ${{ secrets.STAGING_QA_PRODUCTION_EMAIL }}
          STAGING_QA_PRODUCTION_PASSWORD: ${{ secrets.STAGING_QA_PRODUCTION_PASSWORD }}
          STAGING_QA_ACCOUNT_EMAIL: ${{ secrets.STAGING_QA_ACCOUNT_EMAIL }}
          STAGING_QA_ACCOUNT_PASSWORD: ${{ secrets.STAGING_QA_ACCOUNT_PASSWORD }}
          STAGING_QA_CLIENT_EMAIL: ${{ secrets.STAGING_QA_CLIENT_EMAIL }}
          STAGING_QA_CLIENT_PASSWORD: ${{ secrets.STAGING_QA_CLIENT_PASSWORD }}
          STAGING_QA_PASSWORD_SETUP_EMAIL: ${{ secrets.STAGING_QA_PASSWORD_SETUP_EMAIL }}
          STAGING_QA_PASSWORD_SETUP_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD_SETUP_PASSWORD }}
          STAGING_QA_PASSWORD_SETUP_NEW_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD_SETUP_NEW_PASSWORD }}
        run: pnpm exec playwright test -c playwright.staging.config.ts

      - name: Clean isolated staging QA fixture
        if: always()
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          STAGING_QA_SUPER_ADMIN_EMAIL: ${{ secrets.STAGING_QA_SUPER_ADMIN_EMAIL }}
          STAGING_QA_SUPER_ADMIN_PASSWORD: ${{ secrets.STAGING_QA_SUPER_ADMIN_PASSWORD }}
          STAGING_QA_OPERATION_EMAIL: ${{ secrets.STAGING_QA_OPERATION_EMAIL }}
          STAGING_QA_OPERATION_PASSWORD: ${{ secrets.STAGING_QA_OPERATION_PASSWORD }}
          STAGING_QA_PRODUCTION_EMAIL: ${{ secrets.STAGING_QA_PRODUCTION_EMAIL }}
          STAGING_QA_PRODUCTION_PASSWORD: ${{ secrets.STAGING_QA_PRODUCTION_PASSWORD }}
          STAGING_QA_ACCOUNT_EMAIL: ${{ secrets.STAGING_QA_ACCOUNT_EMAIL }}
          STAGING_QA_ACCOUNT_PASSWORD: ${{ secrets.STAGING_QA_ACCOUNT_PASSWORD }}
          STAGING_QA_CLIENT_EMAIL: ${{ secrets.STAGING_QA_CLIENT_EMAIL }}
          STAGING_QA_CLIENT_PASSWORD: ${{ secrets.STAGING_QA_CLIENT_PASSWORD }}
          STAGING_QA_PASSWORD_SETUP_EMAIL: ${{ secrets.STAGING_QA_PASSWORD_SETUP_EMAIL }}
          STAGING_QA_PASSWORD_SETUP_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD_SETUP_PASSWORD }}
        run: node scripts/reset-staging-qa.mjs cleanup

      - name: Retain staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-qa-${{ github.event.pull_request.number }}
          path: |
            staging-fixture.json
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 30
