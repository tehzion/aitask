name: Tagged Release Verification

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate-stage-and-verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
      PRODUCTION_URL: https://aitask-virid.vercel.app
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate release identity and public configuration
        env:
          STAGING_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGING_VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_QA_SUPER_ADMIN_EMAIL: ${{ secrets.STAGING_QA_SUPER_ADMIN_EMAIL }}
          STAGING_QA_SUPER_ADMIN_PASSWORD: ${{ secrets.STAGING_QA_SUPER_ADMIN_PASSWORD }}
          STAGING_QA_OPERATION_EMAIL: ${{ secrets.STAGING_QA_OPERATION_EMAIL }}
          STAGING_QA_OPERATION_PASSWORD: ${{ secrets.STAGING_QA_OPERATION_PASSWORD }}
          STAGING_QA_PRODUCTION_EMAIL: ${{ secrets.STAGING_QA_PRODUCTION_EMAIL }}
          STAGING_QA_PRODUCTION_PASSWORD: ${{ secrets.STAGING_QA_PRODUCTION_PASSWORD }}
          STAGING_QA_ACCOUNT_EMAIL: ${{ secrets.STAGING_QA_ACCOUNT_EMAIL }}
          STAGING_QA_ACCOUNT_PASSWORD: ${{ secrets.STAGING_QA_ACCOUNT_PASSWORD }}
          STAGING_QA_CLIENT_EMAIL: ${{ secrets.STAGING_QA_CLIENT_EMAIL }}
          STAGING_QA_CLIENT_PASSWORD: ${{ secrets.STAGING_QA_CLIENT_PASSWORD }}
          STAGING_QA_PASSWORD_SETUP_EMAIL: ${{ secrets.STAGING_QA_PASSWORD_SETUP_EMAIL }}
          STAGING_QA_PASSWORD_SETUP_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD_SETUP_PASSWORD }}
          STAGING_QA_PASSWORD_SETUP_NEW_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD_SETUP_NEW_PASSWORD }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin master --no-tags
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          grep -F "## [$version]" CHANGELOG.md
          grep -F "## v$version" docs/client-release-notes-2026-08.md
          node scripts/verify-release-db-alignment.mjs
          test -n "$VERCEL_CLI_VERSION"
          for value in \
            "$STAGING_VERCEL_TOKEN" "$STAGING_VERCEL_ORG_ID" "$STAGING_VERCEL_PROJECT_ID" \
            "$STAGING_SUPABASE_URL" "$STAGING_SUPABASE_PUBLISHABLE_KEY" "$STAGING_SUPABASE_PROJECT_REF" \
            "$PRODUCTION_SUPABASE_URL" "$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" \
            "$STAGING_QA_SUPER_ADMIN_EMAIL" "$STAGING_QA_SUPER_ADMIN_PASSWORD" \
            "$STAGING_QA_OPERATION_EMAIL" "$STAGING_QA_OPERATION_PASSWORD" \
            "$STAGING_QA_PRODUCTION_EMAIL" "$STAGING_QA_PRODUCTION_PASSWORD" \
            "$STAGING_QA_ACCOUNT_EMAIL" "$STAGING_QA_ACCOUNT_PASSWORD" \
            "$STAGING_QA_CLIENT_EMAIL" "$STAGING_QA_CLIENT_PASSWORD" \
            "$STAGING_QA_PASSWORD_SETUP_EMAIL" "$STAGING_QA_PASSWORD_SETUP_PASSWORD" \
            "$STAGING_QA_PASSWORD_SETUP_NEW_PASSWORD"; do
            test -n "$value"
          done
          test "$STAGING_SUPABASE_URL" != "$PRODUCTION_SUPABASE_URL"
          test "$STAGING_SUPABASE_URL" = "https://$STAGING_SUPABASE_PROJECT_REF.supabase.co"
          case "$STAGING_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) exit 1 ;; esac
          case "$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) exit 1 ;; esac

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete source and build gate
        run: |
          for attempt in 1 2 3; do
            if pnpm audit --prod --audit-level high; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Production dependency audit attempt $attempt failed; retrying in 20 seconds."
            sleep 20
          done
          pnpm check
          pnpm lint
          pnpm test
          pnpm build
          pnpm verify:pwa
          pnpm verify:release-provenance -- --file dist/build-info.json --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA"

      - name: Validate Supabase rollout in a disposable stack
        run: pnpm verify:supabase:rollout

      - name: Install browser runtime and run local browser gates
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e:pwa
          pnpm test:e2e
          pnpm test:e2e:login-i18n

      - name: Pull isolated staging environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        run: |
          node scripts/prepare-vercel-project-link.mjs
          pnpm dlx "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production --scope "$VERCEL_ORG_ID"

      - name: Build and deploy staging artifact
        id: staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx "vercel@$VERCEL_CLI_VERSION" build --prod --scope "$VERCEL_ORG_ID"
          pnpm verify:release-provenance -- --file .vercel/output/static/build-info.json --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA"
          deployment_url="$(pnpm dlx "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --yes --scope "$VERCEL_ORG_ID")"
          case "$deployment_url" in https://*) ;; *) exit 1 ;; esac
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify staging provenance and secure cutover
        env:
          RELEASE_URL: ${{ steps.staging.outputs.url }}
          VITE_AITASK_BACKEND: supabase
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          AITASK_EXPECT_SECURE_CUTOVER: 'true'
        run: |
          pnpm verify:release-provenance -- --url "$RELEASE_URL" --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA"
          pnpm verify:supabase

      - name: Seed isolated staging QA fixture
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          STAGING_QA_SUPER_ADMIN_EMAIL: ${{ secrets.STAGING_QA_SUPER_ADMIN_EMAIL }}
          STAGING_QA_SUPER_ADMIN_PASSWORD: ${{ secrets.STAGING_QA_SUPER_ADMIN_PASSWORD }}
          STAGING_QA_OPERATION_EMAIL: ${{ secrets.STAGING_QA_OPERATION_EMAIL }}
          STAGING_QA_OPERATION_PASSWORD: ${{ secrets.STAGING_QA_OPERATION_PASSWORD }}
          STAGING_QA_PRODUCTION_EMAIL: ${{ secrets.STAGING_QA_PRODUCTION_EMAIL }}
          STAGING_QA_PRODUCTION_PASSWORD: ${{ secrets.STAGING_QA_PRODUCTION_PASSWORD }}
          STAGING_QA_ACCOUNT_EMAIL: ${{ secrets.STAGING_QA_ACCOUNT_EMAIL }}
          STAGING_QA_ACCOUNT_PASSWORD: ${{ secrets.STAGING_QA_ACCOUNT_PASSWORD }}
          STAGING_QA_CLIENT_EMAIL: ${{ secrets.STAGING_QA_CLIENT_EMAIL }}
          STAGING_QA_CLIENT_PASSWORD: ${{ secrets.STAGING_QA_CLIENT_PASSWORD }}
          STAGING_QA_PASSWORD_SETUP_EMAIL: ${{ secrets.STAGING_QA_PASSWORD_SETUP_EMAIL }}
          STAGING_QA_PASSWORD_SETUP_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD_SETUP_PASSWORD }}
        run: node scripts/reset-staging-qa.mjs seed | tee staging-fixture.json

      - name: Run authenticated staging release QA
        env:
          STAGING_E2E_BASE_URL: ${{ steps.staging.outputs.url }}
          STAGING_QA_SUPER_ADMIN_EMAIL: ${{ secrets.STAGING_QA_SUPER_ADMIN_EMAIL }}
          STAGING_QA_SUPER_ADMIN_PASSWORD: ${{ secrets.STAGING_QA_SUPER_ADMIN_PASSWORD }}
          STAGING_QA_OPERATION_EMAIL: ${{ secrets.STAGING_QA_OPERATION_EMAIL }}
          STAGING_QA_OPERATION_PASSWORD: ${{ secrets.STAGING_QA_OPERATION_PASSWORD }}
          STAGING_QA_PRODUCTION_EMAIL: ${{ secrets.STAGING_QA_PRODUCTION_EMAIL }}
          STAGING_QA_PRODUCTION_PASSWORD: ${{ secrets.STAGING_QA_PRODUCTION_PASSWORD }}
          STAGING_QA_ACCOUNT_EMAIL: ${{ secrets.STAGING_QA_ACCOUNT_EMAIL }}
          STAGING_QA_ACCOUNT_PASSWORD: ${{ secrets.STAGING_QA_ACCOUNT_PASSWORD }}
          STAGING_QA_CLIENT_EMAIL: ${{ secrets.STAGING_QA_CLIENT_EMAIL }}
          STAGING_QA_CLIENT_PASSWORD: ${{ secrets.STAGING_QA_CLIENT_PASSWORD }}
          STAGING_QA_PASSWORD_SETUP_EMAIL: ${{ secrets.STAGING_QA_PASSWORD_SETUP_EMAIL }}
          STAGING_QA_PASSWORD_SETUP_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD_SETUP_PASSWORD }}
          STAGING_QA_PASSWORD_SETUP_NEW_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD_SETUP_NEW_PASSWORD }}
        run: pnpm exec playwright test -c playwright.staging.config.ts

      - name: Clean isolated staging QA fixture
        if: always()
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          STAGING_QA_SUPER_ADMIN_EMAIL: ${{ secrets.STAGING_QA_SUPER_ADMIN_EMAIL }}
          STAGING_QA_SUPER_ADMIN_PASSWORD: ${{ secrets.STAGING_QA_SUPER_ADMIN_PASSWORD }}
          STAGING_QA_OPERATION_EMAIL: ${{ secrets.STAGING_QA_OPERATION_EMAIL }}
          STAGING_QA_OPERATION_PASSWORD: ${{ secrets.STAGING_QA_OPERATION_PASSWORD }}
          STAGING_QA_PRODUCTION_EMAIL: ${{ secrets.STAGING_QA_PRODUCTION_EMAIL }}
          STAGING_QA_PRODUCTION_PASSWORD: ${{ secrets.STAGING_QA_PRODUCTION_PASSWORD }}
          STAGING_QA_ACCOUNT_EMAIL: ${{ secrets.STAGING_QA_ACCOUNT_EMAIL }}
          STAGING_QA_ACCOUNT_PASSWORD: ${{ secrets.STAGING_QA_ACCOUNT_PASSWORD }}
          STAGING_QA_CLIENT_EMAIL: ${{ secrets.STAGING_QA_CLIENT_EMAIL }}
          STAGING_QA_CLIENT_PASSWORD: ${{ secrets.STAGING_QA_CLIENT_PASSWORD }}
          STAGING_QA_PASSWORD_SETUP_EMAIL: ${{ secrets.STAGING_QA_PASSWORD_SETUP_EMAIL }}
          STAGING_QA_PASSWORD_SETUP_PASSWORD: ${{ secrets.STAGING_QA_PASSWORD_SETUP_PASSWORD }}
        run: node scripts/reset-staging-qa.mjs cleanup

      - name: Wait for automatic master deployment
        env:
          VITE_AITASK_BACKEND: supabase
          VITE_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          AITASK_EXPECT_SECURE_CUTOVER: 'true'
          AITASK_VERIFY_ORIGIN: https://aitask-virid.vercel.app
        run: |
          mkdir -p release-evidence
          for attempt in $(seq 1 60); do
            if pnpm verify:release-provenance -- --url "$PRODUCTION_URL" --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA"; then break; fi
            if [ "$attempt" -eq 60 ]; then exit 1; fi
            sleep 15
          done
          pnpm verify:supabase | tee release-evidence/supabase-security.log

      - name: Verify live routes and security headers
        run: |
          verify_route() {
            route="$1"; expected="$2"; label="$3"
            status="$(curl --location --silent --show-error --retry 3 --dump-header "release-evidence/$label.headers" --output "release-evidence/$label.body" --write-out '%{http_code}' "$PRODUCTION_URL$route")"
            test "$status" = "200"
            grep --ignore-case --quiet "^content-type: *$expected" "release-evidence/$label.headers"
            grep --ignore-case --quiet '^content-security-policy:' "release-evidence/$label.headers"
            grep --ignore-case --quiet '^strict-transport-security:' "release-evidence/$label.headers"
            grep --ignore-case --quiet '^x-content-type-options: *nosniff' "release-evidence/$label.headers"
            grep --ignore-case --quiet '^cache-control:.*no-store' "release-evidence/$label.headers"
          }
          verify_route / text/html root
          verify_route /login text/html login
          verify_route /account/password text/html account-password
          verify_route /manifest.webmanifest application/manifest+json manifest
          verify_route /sw.js application/javascript service-worker
          verify_route /build-info.json application/json build-info
          cp release-evidence/build-info.body release-evidence/build-info.json
          pnpm verify:release-provenance -- --file release-evidence/build-info.json --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA"

      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-release-evidence
          path: |
            release-evidence/
            staging-fixture.json
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 90
